name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - "**"  # optional: run on all branches

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Move into the SveltePress docs folder
      - name: Setup Bun in docs
        working-directory: pyeyesweb_docs
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: pyeyesweb_docs
        run: bun install

      - name: Build SveltePress site
        working-directory: pyeyesweb_docs
        run: pnpm run build   # or bun run build if you use Bun

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pyeyesweb_docs/dist   # <-- SveltePress output folder

  docs:
    name: Deploy
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
